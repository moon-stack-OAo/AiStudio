[package]
name = "ai-studio"
version = "0.1.0"
description = "AI Studio - 本地桌面 AI 客户端（对话 / 生图）"
authors = ["Moon"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# unsafe-headers：允许清空 Origin，避免部分中转站因 tauri/localhost Origin 拒绝请求
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
