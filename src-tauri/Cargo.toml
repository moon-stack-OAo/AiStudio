[package]
name = "ai-studio"
version = "1.0.2"
description = "AI Studio - 本地桌面 AI 客户端（对话 / 生图 / 生视频）"
authors = ["Moon"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# unsafe-headers：允许清空 Origin，避免部分中转站因 tauri/localhost Origin 拒绝请求
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }

# 托盘 / 自动更新 / process 仅桌面；Android/iOS 不启用 tray-icon
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Android 侧载更新：下载 APK + 校验
[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
