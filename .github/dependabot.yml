# Dependabot：每周自动检查并创建依赖更新 PR
# 覆盖 npm（前端）、cargo（Tauri/Rust）、github-actions（CI 工作流）
#
# 策略：
# - minor/patch 分组合并，减少噪音
# - major 尽量单独开 PR，人工审阅（尤其 Tauri / crypto）
# - Tauri 前后端插件单独分组，便于对齐版本

version: 2
updates:
  # 前端 npm 依赖（根目录 package.json / package-lock.json）
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # 具体工具链 / 框架优先匹配，避免落入下方通用组
      tauri:
        patterns:
          - '@tauri-apps/*'
        update-types:
          - minor
          - patch
      eslint:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'globals'
        update-types:
          - minor
          - patch
      vite:
        patterns:
          - 'vite'
          - '@vitejs/*'
          - 'vitest'
        update-types:
          - minor
          - patch
      production-dependencies:
        patterns:
          - '*'
        exclude-patterns:
          - '@tauri-apps/*'
          - 'eslint*'
          - '@eslint/*'
          - 'globals'
          - 'vite'
          - '@vitejs/*'
          - 'vitest'
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-dependencies:
        patterns:
          - '*'
        exclude-patterns:
          - '@tauri-apps/*'
          - 'eslint*'
          - '@eslint/*'
          - 'globals'
          - 'vite'
          - '@vitejs/*'
          - 'vitest'
        dependency-type: development
        update-types:
          - minor
          - patch

  # Rust / Tauri 依赖（src-tauri/Cargo.toml + Cargo.lock）
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: 'chore(deps)'
    groups:
      tauri:
        patterns:
          - 'tauri'
          - 'tauri-*'
        update-types:
          - minor
          - patch
      cargo-minor-patch:
        patterns:
          - '*'
        exclude-patterns:
          - 'tauri'
          - 'tauri-*'
        update-types:
          - minor
          - patch
    ignore:
      # Android 侧校验 / HTTP：major 常伴随 API 变更，单独人工升级
      - dependency-name: sha2
        update-types:
          - version-update:semver-major
      - dependency-name: reqwest
        update-types:
          - version-update:semver-major

  # GitHub Actions 工作流中的 action 版本
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: 'chore(deps)'
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
