# 日常 CI（非发版）：PR / 推送到主开发分支时校验前端构建与主题同步
# 不跑完整 Tauri 原生构建（太重）；可选 cargo check 做 Rust 编译期校验
name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check theme sync
        run: npm run check:theme

      - name: Lint
        run: npm run lint

      - name: Format check
        # 纯格式校验（与 npm run format 对称）
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Build desktop
        run: npm run build:desktop

      - name: Build android (Vite)
        run: npm run build:android

  # 轻量 Rust 校验，不做完整 cargo build / Tauri 打包
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tauri 2 在 Ubuntu 上需要 WebKitGTK 4.1 等系统库，否则 cargo check 会在 pkg-config 阶段失败
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
