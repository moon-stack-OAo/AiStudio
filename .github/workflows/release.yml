# 推送 v* tag 时构建 Windows 安装包、签名更新产物并上传 GitHub Release
# 示例：git tag v0.1.1 && git push origin v0.1.1
#
# 仓库 Secrets（必需）：
# - TAURI_SIGNING_PRIVATE_KEY：私钥全文（~/.tauri/ai-studio.key 内容）
# - TAURI_SIGNING_PRIVATE_KEY_PASSWORD：私钥密码
#
# Release 正文：自动从 CHANGELOG.md 截取与 tag 对应的版本章节
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Extract changelog for this version
        id: changelog
        shell: bash
        run: |
          node .github/scripts/extract-changelog.mjs "${{ github.ref_name }}"
          {
            echo "body<<EOF"
            cat release-notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app & create Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: AI Studio ${{ github.ref_name }}
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          projectPath: .
          tauriScript: npm run tauri
          args: --bundles nsis,msi
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
