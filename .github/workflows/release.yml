# 推送 v* tag 时构建 Windows 安装包 + Android APK，并上传到同一 GitHub Release
# 示例：git tag v0.1.1 && git push origin v0.1.1
#
# 流程：先创建 draft Release → Windows / Android 并行构建上传 → 两端成功后再正式发布
# （避免 Windows 先发版导致更新通道出现不完整资产）
#
# 仓库 Secrets（Windows Updater 签名必需）：
# - TAURI_SIGNING_PRIVATE_KEY：私钥全文（~/.tauri/ai-studio.key 内容）
# - TAURI_SIGNING_PRIVATE_KEY_PASSWORD：私钥密码
#
# Android APK（正式签名，可侧载安装）：
# - ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD / ANDROID_KEY_BASE64
#
# Release 正文：自动从 CHANGELOG.md 截取与 tag 对应的版本章节
name: release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  create-draft:
    runs-on: ubuntu-latest
    outputs:
      releaseId: ${{ steps.release.outputs.releaseId }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Extract changelog for this version
        id: changelog
        shell: bash
        run: |
          node .github/scripts/extract-changelog.mjs "${{ github.ref_name }}"
          {
            echo "body<<EOF"
            cat release-notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or reuse draft Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          TITLE="AI Studio ${TAG}"
          PRERELEASE_ARGS=()
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::Release $TAG 已正式发布，拒绝覆盖。请换新 tag 或手动处理。"
              exit 1
            fi
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              "${PRERELEASE_ARGS[@]}"
            echo "::notice::复用已有 draft Release: $TAG"
          else
            gh release create "$TAG" \
              --draft \
              --title "$TITLE" \
              --notes-file release-notes.md \
              "${PRERELEASE_ARGS[@]}"
            echo "::notice::已创建 draft Release: $TAG"
          fi

          RELEASE_ID="$(gh release view "$TAG" --json databaseId --jq .databaseId)"
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "::error::无法读取 Release databaseId"
            exit 1
          fi
          echo "releaseId=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "releaseId=$RELEASE_ID"

  publish-windows:
    needs: create-draft
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app & upload to draft Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-draft.outputs.releaseId }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          projectPath: .
          tauriScript: npm run tauri
          args: --bundles nsis,msi
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true

  publish-android:
    needs: create-draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973" \
            "platform-tools"
          sdkmanager --list_installed | head -n 40

      - name: Export ANDROID_HOME / NDK_HOME
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          NDK_ROOT="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          if [ -z "$NDK_ROOT" ] || [ ! -d "$NDK_ROOT" ]; then
            echo "::error::Android NDK not found under SDK"
            exit 1
          fi
          echo "NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "Using NDK_HOME=$NDK_ROOT"

      - name: Install Rust stable (Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Android project if missing
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            echo "::notice::src-tauri/gen/android 不存在，执行 tauri android init --ci"
            npx tauri android init --ci --skip-targets-install
          else
            echo "::notice::已存在 src-tauri/gen/android，跳过 init"
          fi
          test -d "src-tauri/gen/android"

      # init 生成的是默认图标；用仓库内 icons/android 覆盖到 Android 工程 res
      - name: Apply Android launcher icons
        run: |
          SRC="src-tauri/icons/android"
          DEST="src-tauri/gen/android/app/src/main/res"
          test -d "$SRC"
          test -d "$DEST"
          for density in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi mipmap-anydpi-v26; do
            if [ -d "$SRC/$density" ]; then
              mkdir -p "$DEST/$density"
              cp -f "$SRC/$density/"* "$DEST/$density/"
              echo "copied $density"
            fi
          done
          if [ -f "$SRC/values/ic_launcher_background.xml" ]; then
            mkdir -p "$DEST/values"
            cp -f "$SRC/values/ic_launcher_background.xml" "$DEST/values/"
            echo "copied values/ic_launcher_background.xml"
          fi

      - name: Setup Android release signing
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_KEY_BASE64" ]; then
            echo "::error::缺少 ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD / ANDROID_KEY_BASE64 Secrets"
            exit 1
          fi
          cd src-tauri/gen/android
          echo "keyAlias=${ANDROID_KEY_ALIAS}" > keystore.properties
          echo "password=${ANDROID_KEY_PASSWORD}" >> keystore.properties
          echo "${ANDROID_KEY_BASE64}" | base64 -d > "${RUNNER_TEMP}/keystore.jks"
          echo "storeFile=${RUNNER_TEMP}/keystore.jks" >> keystore.properties
          test -s "${RUNNER_TEMP}/keystore.jks"
          cd ../../..
          node .github/scripts/patch-android-signing.mjs
          node .github/scripts/sync-android-updater-sources.mjs

      # 正式 release 签名 APK；上传到已有 draft，不改标题/正文
      - name: Build Android APK (arm64, release-signed)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_NDK_HOME: ${{ env.NDK_HOME }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          mobile: android
          args: --apk --ci --target aarch64
          releaseId: ${{ needs.create-draft.outputs.releaseId }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          releaseAssetNamePattern: '[name]_[version][ext]'
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

      - name: Fallback upload APK if action missed assets
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          ASSET_NAME="AI.Studio_${VERSION}.apk"

          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qxF "$ASSET_NAME"; then
            echo "Release already has $ASSET_NAME，跳过 fallback"
            exit 0
          fi
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qiE '\.apk$'; then
            echo "Release 已有其他 APK 资产，跳过 fallback"
            exit 0
          fi

          # 优先正式产物路径，再按命名启发式挑选，避免误传 debug/unsigned
          PREFERRED=(
            "src-tauri/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release.apk"
            "src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          )
          SRC=""
          for p in "${PREFERRED[@]}"; do
            if [ -f "$p" ]; then
              SRC="$p"
              break
            fi
          done
          if [ -z "$SRC" ]; then
            mapfile -t APKS < <(
              find src-tauri/gen/android -type f \( -name 'AI.Studio_*.apk' -o -name '*-release.apk' -o -name '*.apk' \) 2>/dev/null \
                | grep -viE '(unsigned|debug)' \
                || true
            )
            if [ "${#APKS[@]}" -eq 0 ]; then
              echo "No APK found for fallback upload"
              exit 0
            fi
            SRC="${APKS[0]}"
          fi
          OUT="${RUNNER_TEMP}/${ASSET_NAME}"
          cp -f "$SRC" "$OUT"
          echo "Fallback upload: $SRC -> $ASSET_NAME"
          gh release upload "$TAG" "$OUT" --clobber

      - name: Generate & upload android-latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          TAG="${{ github.ref_name }}"
          node .github/scripts/generate-android-latest.mjs "$TAG"
          test -f android-latest.json
          gh release upload "$TAG" android-latest.json --clobber
          echo "已上传 android-latest.json"

  # 两端构建都成功后，校验关键资产再正式发布
  publish-release:
    needs: [publish-windows, publish-android]
    runs-on: ubuntu-latest
    steps:
      - name: Verify assets and publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          mapfile -t ASSETS < <(gh release view "$TAG" --json assets --jq '.assets[].name')
          printf '当前资产:\n'
          printf '  - %s\n' "${ASSETS[@]}"

          missing=0
          require() {
            local pattern="$1"
            local label="$2"
            if printf '%s\n' "${ASSETS[@]}" | grep -qiE "$pattern"; then
              echo "OK: $label"
            else
              echo "::error::缺少资产: $label (pattern=$pattern)"
              missing=1
            fi
          }

          require '\.exe$' "Windows NSIS installer"
          require '\.msi$' "Windows MSI"
          require '\.apk$' "Android APK"
          require '^latest\.json$' "Desktop updater latest.json"
          require '^android-latest\.json$' "Android updater android-latest.json"

          if [ "$missing" -ne 0 ]; then
            echo "::error::资产不完整，保持 draft，不正式发布"
            exit 1
          fi

          gh release edit "$TAG" --draft=false
          echo "::notice::已正式发布 $TAG"
